name: Run Automation Suite

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Ubuntu runners come with Chrome pre-installed, but headless mode is safer in CI.
      # If the UI test fails in Actions (no visible display), see the README note on
      # adding --headless=new to ChromeOptions in LoginTest's setUp().
      - name: Run Tests
        run: mvn test
